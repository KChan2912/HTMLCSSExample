



<main class="row justify-content-center">
  <div class="row justify-content-center my-5 parentclass">

    
    <div class="col-9" style="background-color: #F0F0F0;">

      <div class="col-9 mx-auto" style="display: flex; align-items: center; justify-content: center;">
        <p style="text-align: center; font-size: 20pt; padding-top: 15px;">Weather Search⛅</p>
      </div>
      
      <div class="col-12 mx-auto">
        <form #myForm="ngForm" (ngSubmit)="onSubmit()">


          <div class="mb-1 form-group" >
            <div class="col-12 form-group" style="display: flex; align-items: center;justify-content: center;">
              <div class="col-2 mx-0 form-group" style="display: flex; align-items: center; ">
                <label for="street" class="form-label required">Street</label>
              </div>
              <div class="col-6 mx-0 form-group" style="display: flex; align-items: center; justify-content: center;">
                <input name="street" type="text" class="form-control" id="street" [(ngModel)]="formData.street" [disabled]="autodetect">
              </div>
              
            </div>
          </div>


          <div class="mb-1 form-group" >
            <div class="col-12 form-group" style="display: flex; align-items: center; justify-content: center;">
              <div class="col-2 mx-0 form-group" style="display: flex; align-items: center;">
                <label for="city" class="form-label required">City</label>
              </div>
              <div class="col-6 mx-0 form-group" style="display: flex; align-items: center;">
                <input name="city" type="text" class="form-control" id="city" [(ngModel)]="formData.city" [disabled]="autodetect">
              </div>
              
            </div>
          </div>


          <div class="mb-1 form-group" >
            <div class="col-12 form-group" style="display: flex; align-items: center; justify-content: center;">
              <div class="col-2 mx-0 form-group" style="display: flex; align-items: center;">
                <label for="state" class="form-label required">State</label>
              </div>
              <div class="col-3 mx-0 form-group" style="display: flex; align-items: center;">
                <mat-select name="state" type="text" class="form-control" id="state" [(ngModel)]="formData.state" [disabled]="autodetect">

                  <mat-option *ngFor="let state of states" [value]="state">
                    {{ state }}
                  </mat-option>
                </mat-select>
              </div>
              <div class="col-3 mx-0 form-group" style="display: flex; align-items: center;">
                
              </div>
              
            </div>
          </div>

          <hr class="col-9">
         
          <div class="mb-3 form-group">
            <div class="col-12 form-group" style="display: flex; align-items: center; justify-content: center;">
              <div class="col-6 form-group" style="display: flex; align-items: center; justify-content: center;">
                <div class="col-2 form-group"></div>
                <div class="col-4 form-group" style="display: flex; align-items: center; justify-content: center;">
                  <label class="form-check-label" for="autodetect">Autodetect Location</label>
                </div>
                
                <div class="col-3 form-group" style="display: flex; align-items: center; justify-content: center;">

                  <input type="checkbox" class="form-check-input" id="autodetect" name="autodetect" [(ngModel)]="autodetect" (click)="disableForm()">
                  <label class="form-check-label" for="autodetect">Current Location</label>
                </div>
                <div class="col-3 form-group"></div>
                
              </div>
              
            </div>            
          </div>

          <div class="pb-3 form-group">
            <div class="col-12 form-group" style="display: flex; align-items: center; justify-content: center;">
              
                
                <button style="margin-right: 10px;" type="submit" class="btn btn-primary bi bi-search"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                  <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg> Search</button>
            
               
                <button  type="button" class="btn btn-light btn-outline-dark" style="margin-left: 10px;" (click)="resetForm()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list-nested" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M4.5 11.5A.5.5 0 0 1 5 11h10a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5m-2-4A.5.5 0 0 1 3 7h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m-2-4A.5.5 0 0 1 1 3h10a.5.5 0 0 1 0 1H1a.5.5 0 0 1-.5-.5"/>
                </svg>Clear</button>
                
                
              
              
            </div>
            
          </div>
          
        </form>
      </div>
      
  
    
    </div>

    <div class="col-12 col-lg-9 py-3">
      <ul class="nav nav-pills mx-auto justify-content-center" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home" aria-selected="true">Results</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile" type="button" role="tab" aria-controls="pills-profile" aria-selected="false">Favorites</button>
        </li>
      </ul>
      <div class="tab-content" id="pills-tabContent">
        <div class="tab-pane fade show active detailscontainer my-5" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab" style="position: relative;">
          
          <div id="progressBarBox" class="container mt-5 hidden">
            <div class="progress">
                <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
                    role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
                    style="width: 0%; transition: width 0.1s;">
                </div>
            </div>
        </div>
          <div id="mainresultscontainer" style="display: none;">
            
          <div id="slidingdiv" class="detailscontent slidein" style="animation-play-state: paused;">
          
          <div class="detailspane">
            <p id="resulttitle" style="text-align: center; padding-top: 20px; font-size: 19pt;">Data from API:</p>
            <div class="col-12 justify-content-end" style="display: flex;">
              
              <button class="btn btn-link bi bi-search" style="z-index: 10;" (click)="Slide()">Details</button>
            </div>

      
            <ul class="nav nav-tabs justify-content-end" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab" aria-controls="home" aria-selected="true">Day View</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button" role="tab" aria-controls="profile" aria-selected="false">Daily Temp. Chart</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab" aria-controls="contact" aria-selected="false">Meteogram</button>
            </li>
            </ul>
              <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Date</th>
                    <th scope="col">Status</th>
                    <th scope="col">Temp. High (°F)</th>
                    <th scope="col">Temp. Low (°F)</th>
                    <th scope="col">Wind Speed (mph)</th>
                  </tr>
                </thead>
                <tbody id="dailytable">
                
                </tbody>
              </table>
            </div>
            <div class="tab-pane fade" id="profile" role="tabpanel" aria-labelledby="profile-tab">
              <div id="temp-minmax">


              </div>
          
            </div>
            <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">

              <div class="hourly-weather" id="hourly-weather">


              </div>


            </div>
              </div>
          </div>

          <div class="animatedpane detailspane">
            <div class="col-12 justify-content-between" style="display: flex;">
              <button class="btn btn-light bi bi-search" style="z-index: 10;" (click)="Slide()">List</button>
              <p id="DetailedDatePlaceHolder" style="font-size: 19pt; margin-top: 10px;">DATE</p>
              <a id="tweet" href="https://google.com" target="_blank" rel="noopener noreferrer">
              <button class="btn btn-light bi bi-search" style="z-index: 10;" (click)="tweet()">
                
                <img src="../assets/twitter-x.svg" style="height: 25px;">
              </button>
              </a>
              
              

            </div>
            <table class="table table-striped my-3">
              <colgroup>
                <col style="width: 40%;">
                <col style="width: 60%;">
              </colgroup> 
              <tbody id="DetailedTableTableBody"> 
                  <tr> 
                      <td><b>Status</b></td> 
                      <td id="DetailedStatus">-</td> 
                       
                  </tr> 
                  <tr> 
                      <td><b>Max Temperature</b></td> 
                      <td id="DetailedMaxTemp">-</td> 
                      
                  </tr> 
                  <tr> 
                      <td><b>Min Temperature</b></td> 
                      <td id="DetailedMinTemp">-</td> 
                       
                  </tr>
                  <tr> 
                    <td><b>Apparent Temperature</b></td> 
                    <td id="DetailedAppTemp">-</td> 
                     
                  </tr> 
                  <tr> 
                    <td><b>Sun Rise Time</b></td> 
                    <td id="SunRiseTime">-</td> 
                    
                  </tr> 
                  <tr> 
                    <td><b>Sun Set Time</b></td> 
                    <td id="SunSetTime">-</td> 
                     
                  </tr> 
                  <tr> 
                  <td><b>Humidity</b></td> 
                  <td id="Humidity">-</td> 
                   
                  </tr> 
                  <tr> 
                  <td><b>Wind Speed</b></td> 
                  <td id="WindSpeed">-</td> 
                  
                  </tr> 
                  <tr> 
                  <td><b>Visibility</b></td> 
                  <td id="Visibility">-</td> 
                   
                  </tr> 
                  <tr> 
                <td><b>Cloud Cover</b></td> 
                <td id="CloudCover">-</td> 
                 
                </tr>
              </tbody> 
          </table> 
          <div id="map"></div>
          </div>
          </div>
        </div>
          <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">...</div>
        </div>
      
      </div>
      
    </div>
  </div>
  
</main>
<style>
  @keyframes slidein{
    from{
      transform: translateX(0%);
    }
    to{
      transform: translateX(-100%);
    }
  
  }

  @keyframes slideout{
    from{
      transform: translateX(-100%);
    }
    to{
      transform: translateX(0%);
    }

  }

  .mat-mdc-select-disabled {
    background-color: #E9ECEF;
  }
  .mat-select-panel.mat-select-panel-disabled {
  background-color: lightgray; /* Replace with your desired color */
  }

  .required:after{content: " *"; color: red;}



  body
  {
    overflow-x: hidden;
  }
  .detailscontainer{
    overflow: hidden;
    width: 100%;

  }
  .detailscontent{
    width: 100%;
    display: flex;
    transition: transform;
    transform: translateX(0%);
    
  }
  .detailspane{
    width:100%;
    flex-shrink: 0;

  }
  .nav-tabs {
    text-align:right;
  }
  .parentclass{
    max-width: 100%;
  }
  .nav-tabs > li {
    display:inline-block;
    float:none;
  }
  .animatedpane{
    height: 600px; 
    width:100%;


  }
  .slidein{
    animation: slidein 1s forwards;
  }

  .slideout{
    animation: slideout 1s forwards;
  }
.hidden{
  display: none;
}

  #map {
    width: 100%;
    height: 200px;
}
  </style>


<router-outlet />
